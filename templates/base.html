<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petcare - Control de Mascotas</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
<style>
  body {
    background-image: url("{{ url_for('static', filename='fondo.jpeg') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
    background-color: #0e422c;
  }

  /* Sombra para que los textos se lean bien sobre la imagen */
  h1, h2, h3, p, label, a {
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
  }

  /* Estilo del botón 3D verde */
  .btn-custom-green {
    font-size: 17px;
    padding: 10px 25px;
    border-radius: 0.7rem;
    background-image: linear-gradient(#2ecc71, #27ae60);
    border: 2px solid #1e8449;
    border-bottom: 5px solid #196f3d;
    box-shadow: 0px 1px 6px 0px rgba(39, 174, 96, 0.5);
    transform: translateY(-3px);
    cursor: pointer;
    transition: 0.2s linear;
    color: white !important;
    text-decoration: none;
    display: inline-block;
    font-weight: bold;
  }

  .btn-custom-green:hover {
    background-image: linear-gradient(#27ae60, #219150);
    color: white !important;
  }

  .btn-custom-green:active {
    transform: translateY(0);
    border-bottom: 2px solid #196f3d;
  }
</style>
</head>
<body>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('ver_mascotas') }}">Mascotas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('registrar_mascota') }}">Registrar</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('vacunas') }}">Vacunas y Salud</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico de las demás páginas -->
    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
